# hyprlock - lock screen for the niri session.
#
# Replaces swaylock, which could not usefully do fingerprint: its PAM
# conversation discards PAM_TEXT_INFO, so pam_fprintd's "place your finger"
# prompt was silently dropped, and it only calls pam_authenticate() after you
# press Enter. hyprlock talks to fprintd over D-Bus directly instead, so it can
# prompt properly and listen from the moment the screen locks.
#
# Colours are ayu-dark, matching waybar, mako, swaybg and niri's focus ring.

$font = Hack Nerd Font Mono

general {
    hide_cursor = true
    # With fingerprint as the primary path, Enter often gets pressed on an
    # empty field. Without this that counts as a failed attempt and flashes
    # the field red for no reason.
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        # Milliseconds before re-arming the reader after a failed scan.
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # Flat colour rather than `path = screenshot`: a blurred screenshot leaks
    # whatever was on screen when it locked, which is the wrong default for a
    # machine that locks itself after ten idle minutes.
    color = rgba(0D1017FF)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(BFBDB6FF)
    font_size = 96
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(757C87FF)
    font_size = 18
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    inner_color = rgba(232834FF)
    outer_color = rgba(E6B450FF)   # ayu gold, as used by niri's focus ring
    check_color = rgba(AAD94CFF)   # green while verifying
    fail_color  = rgba(F07178FF)   # red on failure
    font_color  = rgba(BFBDB6FF)

    fade_on_empty = false
    placeholder_text = <span foreground="##757C87">Password or fingerprint</span>
    fail_text = <span foreground="##F07178">$FAIL ($ATTEMPTS)</span>

    position = 0, -40
    halign = center
    valign = center
}
