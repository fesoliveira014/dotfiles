# The systemd user manager does not read shell rc files, so its PATH is the
# bare login default: ~/.cargo/bin plus the system directories. Everything niri
# spawns inherits that PATH, which means binaries installed to ~/.local/bin and
# ~/go/bin are invisible to keybindings and spawn-at-startup unless named by
# absolute path.
#
# This is why ~/.config/niri/config.kdl launches alacritty as
# /home/fesoliveira/.local/bin/alacritty rather than as "alacritty".
#
# Read by systemd --user at login. Apply without logging out with:
#   systemctl --user import-environment PATH
# after sourcing the same value, or simply log out and back in.
PATH=/home/fesoliveira/.local/bin:/home/fesoliveira/go/bin:/home/fesoliveira/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
